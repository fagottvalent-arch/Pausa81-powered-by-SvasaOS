<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sfondo Ossidiana Medical-Tech -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111e" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#09222c" />
    </linearGradient>

    <!-- Anello Orbitale 60s Teal Smeraldo -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Bagliore Centrale SvasaOS -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.32" />
      <stop offset="70%" stop-color="#0ea5e9" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Apple iOS / VisionOS -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" />

  <!-- Aura Biofilica Centrale -->
  <circle cx="256" cy="256" r="196" fill="url(#coreGlow)" />

  <!-- Traccia Orbitale Secondi (60s) -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#334155" stroke-width="14" stroke-opacity="0.45" />
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#ringGrad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="920 1106" transform="rotate(-90 256 256)" />

  <!-- Onda Binaurale 432Hz Stilizzata -->
  <path d="M 118 288 Q 165 248, 212 288 T 304 288 T 394 288" fill="none" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" stroke-opacity="0.45" />

  <!-- Punto Focale Neuro-Visivo (Oro/Ambra Caldo) -->
  <circle cx="256" cy="122" r="11" fill="#fde047" />
  <circle cx="256" cy="122" r="20" fill="none" stroke="#fde047" stroke-opacity="0.35" stroke-width="3" />

  <!-- Monogramma Architettonico P81 -->
  <text x="256" y="268" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &#39;Inter&#39;, &#39;Segoe UI&#39;, sans-serif" font-size="118" font-weight="800" letter-spacing="-4" fill="#f8fafc">
    P81
  </text>

  <!-- Sottotitolo Tecnico SVASA-OS -->
  <text x="256" y="346" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &#39;Inter&#39;, &#39;Segoe UI&#39;, sans-serif" font-size="23" font-weight="700" letter-spacing="7" fill="#5eead4">
    SVASA·OS
  </text>
</svg>
